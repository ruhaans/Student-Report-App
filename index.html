<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Report Portal</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

    <!-- ======================================
                    SIDEBAR
    ======================================= -->

    <aside class="sidebar">

        <h2>Students</h2>

        <div class="search-box">

            <input
                type="text"
                id="searchStudent"
                placeholder="🔍 Search student...">

        </div>

        <div class="progress-container">

            <div class="progress-header">

                <span>Progress</span>

                <span id="progressPercent">0%</span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

            <p id="progressText">

                0 / 36 Completed

            </p>

        </div>

        <div id="studentList"></div>

    </aside>

    <!-- ======================================
                    CONTENT
    ======================================= -->

    <main class="content">

        <div class="content-wrapper">

            <!-- ======================================
                        TOP TOOLBAR
            ======================================= -->

            <header class="toolbar">

                <div class="toolbar-left">

                    <h1 id="studentName">

                        Select Student

                    </h1>

                    <div class="toolbar-meta">

                        <span id="studentNumber">

                            Student #1

                        </span>

                        <span class="dot">•</span>

                        <span id="studentPosition">

                            1 / 36

                        </span>

                    </div>

                </div>

                <div class="toolbar-right">

                    <div
                        id="statusBar"
                        class="status saved">

                        ✔ Saved

                    </div>

                    <button
                        id="previousButton">

                        ◀ Previous

                    </button>

                    <button
                        id="nextButton">

                        Next ▶

                    </button>

                </div>

            </header>

            <!-- ======================================
                        INTRODUCTION
            ======================================= -->

            <section class="report-card">

                <div class="card-title">

                    🧑 Introduction

                </div>

                <textarea
                    id="introduction"></textarea>
                    <div class="word-count">
    <span id="introductionCount">0 words</span>
</div>

            </section>

            <!-- ======================================
                        ENGLISH
            ======================================= -->

            <section class="report-card">

                <div class="card-title">

                    📚 English

                </div>

                <div class="two-column">

                    <div class="field-card">

                        <label>

                            ⭐ Appreciation

                        </label>

                        <textarea
                            id="englishAppreciation"></textarea>
                            <div class="word-count">
    <span id="englishAppreciationCount">0 words</span>
</div>

                    </div>

                    <div class="field-card">

                        <label>

                            💡 Suggestion

                        </label>

                        <textarea
                            id="englishSuggestion"></textarea>
                            <div class="word-count">
    <span id="englishSuggestionCount">0 words</span>
</div>

                    </div>

                </div>

            </section>

            <!-- ======================================
                        MATHEMATICS
            ======================================= -->

            <section class="report-card">

                <div class="card-title">

                    ➗ Mathematics

                </div>

                <div class="two-column">

                    <div class="field-card">

                        <label>

                            ⭐ Appreciation

                        </label>

                        <textarea
                            id="mathAppreciation"></textarea>
                            <div class="word-count">
    <span id="mathAppreciationCount">0 words</span>
</div>

                    </div>

                    <div class="field-card">

                        <label>

                            💡 Suggestion

                        </label>

                        <textarea
                            id="mathSuggestion"></textarea>
                            <div class="word-count">
    <span id="mathSuggestionCount">0 words</span>
</div>

                    </div>

                </div>

            </section>

            <!-- ======================================
                        EVS
            ======================================= -->

            <section class="report-card">

                <div class="card-title">

                    🌿 EVS

                </div>

                <div class="two-column">

                    <div class="field-card">

                        <label>

                            ⭐ Appreciation

                        </label>

                        <textarea
                            id="evsAppreciation"></textarea>
                            <div class="word-count">
    <span id="evsAppreciationCount">0 words</span>
</div>

                    </div>

                    <div class="field-card">

                        <label>

                            💡 Suggestion

                        </label>

                        <textarea
                            id="evsSuggestion"></textarea>
                            <div class="word-count">
    <span id="evsSuggestionCount">0 words</span>
</div>

                    </div>

                </div>

            </section>

            <div class="bottom-actions">

    <button
        id="previousBottomButton"
        class="secondary-button">

        ◀ Previous

    </button>

    <button
        id="saveButton">

        💾 Save Report

    </button>

    <button
        id="nextBottomButton"
        class="secondary-button">

        Next ▶

    </button>

</div>

        </div>

    </main>

</div>

<script
        type="module"
        src="script.js"></script>

</body>

</html>
