<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Report Portal</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

        <h2>Students</h2>

        <div id="studentList"></div>

    </aside>


    <!-- RIGHT CONTENT -->

    <main class="content">

        <div class="header">

    <h1 id="studentName">
        Select Student
    </h1>

    <p id="studentNumber">
        SR No :
    </p>

    <div id="statusBar" class="status saved">

        Ready

    </div>

</div>

        <section>

            <h2>Introduction</h2>

            <textarea
                id="introduction">
            </textarea>

        </section>


        <section>

            <h2>English</h2>

            <label>

                Appreciation

            </label>

            <textarea
                id="englishAppreciation">
            </textarea>

            <label>

                Suggestion

            </label>

            <textarea
                id="englishSuggestion">
            </textarea>

        </section>


        <section>

            <h2>Mathematics</h2>

            <label>

                Appreciation

            </label>

            <textarea
                id="mathAppreciation">
            </textarea>

            <label>

                Suggestion

            </label>

            <textarea
                id="mathSuggestion">
            </textarea>

        </section>


        <section>

            <h2>EVS</h2>

            <label>

                Appreciation

            </label>

            <textarea
                id="evsAppreciation">
            </textarea>

            <label>

                Suggestion

            </label>

            <textarea
                id="evsSuggestion">
            </textarea>

        </section>


        <button
            id="saveButton">

            Save

        </button>

    </main>

</div>

<script
type="module"
src="script.js">

</script>

</body>

</html>
